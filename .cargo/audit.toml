# `cargo audit` configuration.
#
# Every entry below is a finding we cannot fix from this repo: the vulnerable
# crate arrives transitively behind a dependency that has not moved off an old
# major. Each one names the path and why it is not reachable here. Nothing is
# ignored because it is inconvenient — an ignore with no reason is how a real
# advisory hides among the noise.
#
# Removing an entry is the goal, not the exception.

[advisories]
ignore = [
    # rsa 0.9.10 — Marvin timing side channel, no fixed release exists.
    # Path: sqlx -> sqlx-macros-core -> sqlx-mysql -> rsa. sqlx 0.8 records
    # every driver in Cargo.lock whatever features are enabled; IONe enables
    # only postgres, so sqlx-mysql and rsa are never compiled
    # (`cargo tree -i rsa` prints nothing). It cannot be removed from the
    # lockfile until sqlx stops listing optional drivers there.
    "RUSTSEC-2023-0071",
    # libsqlite3-sys 0.30.1 — bundled SQLite before 3.54.0 (CVE-2026-119375),
    # fixed in libsqlite3-sys 0.39.0.
    # Path: sqlx -> sqlx-sqlite -> libsqlite3-sys, the same lockfile-only
    # listing as rsa above: IONe enables only postgres, so sqlx-sqlite and
    # libsqlite3-sys are never compiled (`cargo tree --target all -i
    # libsqlite3-sys` prints nothing) and no SQLite file is ever opened.
    # No upgrade path: sqlx-sqlite 0.8.6 requires libsqlite3-sys ^0.30.1 and
    # sqlx-sqlite 0.9.0 requires <0.38.0. Remove this entry when a sqlx release
    # accepts libsqlite3-sys >= 0.39.
    "RUSTSEC-2026-0459",
]
