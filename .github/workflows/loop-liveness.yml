name: Loop liveness

# A blocked loop and a quiet loop look identical from outside. Between
# 2026-08-10 and 2026-08-29 the three routines fired ~19 times and every run
# reported SUCCEEDED, while none of them could write to GitHub: the scout
# drafted three candidates it could not file, and the builder fixed #26,
# verified it across 57 integration suites, and could not push. Nothing
# surfaced that for three weeks.
#
# This opens an issue when there is ready work and nothing has merged. It does
# not diagnose — it just makes silence visible.
on:
  schedule:
    - cron: "0 15 * * 6"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: read
  contents: read

env:
  STALL_TITLE: "Automation loop has not merged in 7 days"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = process.env.STALL_TITLE;
            const weekAgo = new Date(Date.now() - 7 * 24 * 3600 * 1000);

            const ready = (await github.paginate(
              github.rest.issues.listForRepo,
              { ...context.repo, state: 'open', labels: 'backlog-ready', per_page: 100 }
            )).filter(item => !item.pull_request);

            if (ready.length === 0) {
              core.info('no backlog-ready work; an idle loop is correct');
              return;
            }

            const merged = (await github.paginate(
              github.rest.pulls.list,
              { ...context.repo, state: 'closed', sort: 'updated', direction: 'desc', per_page: 50 }
            )).filter(pr => pr.merged_at && new Date(pr.merged_at) > weekAgo);

            if (merged.length > 0) {
              core.info(`${merged.length} PR(s) merged in the last 7 days; loop is alive`);
              return;
            }

            const oldest = ready[ready.length - 1];
            const body = [
              `${ready.length} issue(s) carry \`backlog-ready\` and no pull request has merged since ${weekAgo.toISOString().slice(0, 10)}.`,
              '',
              `Oldest ready: #${oldest.number} — ${oldest.title}`,
              '',
              'The runs may be reporting SUCCEEDED while blocked. Check, in this order:',
              '- the Claude GitHub App still has Contents / Issues / Pull requests write on this repo',
              '- the routines are enabled and firing (`RemoteTrigger` `get` / `list_runs`)',
              '- the last run log for the gate that stopped it (`RemoteTrigger` `get_run_log`)',
              '- `main` CI is not red',
            ].join('\n');

            const existing = (await github.paginate(
              github.rest.issues.listForRepo,
              { ...context.repo, state: 'open', per_page: 100 }
            )).find(item => !item.pull_request && item.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.number, body,
              });
              core.warning(`loop still stalled; commented on #${existing.number}`);
              return;
            }

            const { data: issue } = await github.rest.issues.create({
              ...context.repo, title, body,
            });
            core.warning(`loop stalled; opened #${issue.number}`);
